[workspace]
members = [
    "crates/donna",
    "crates/donna-ai",
    "crates/donna-config",
    "crates/donna-core",
    "crates/donna-harness",
    "crates/donna-integrations",
    "crates/donna-storage",
    "crates/donna-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ab_glyph = "0.2"
directories = "6"
eframe = "0.34"
egui_kittest = { version = "0.34", features = ["eframe"] }
epaint_default_fonts = "0.34"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"

donna-ai = { path = "crates/donna-ai" }
donna-config = { path = "crates/donna-config" }
donna-core = { path = "crates/donna-core" }
donna-harness = { path = "crates/donna-harness" }
donna-integrations = { path = "crates/donna-integrations" }
donna-storage = { path = "crates/donna-storage" }
donna-ui = { path = "crates/donna-ui" }
